name: CI
on:
  push:
  pull_request:

jobs:
  cli:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
          - runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxe dos scripts
        run: for f in scripts/*.sh install.sh linux-build.sh termux-proot/proot.sh; do bash -n "$f"; done
      - name: Build do CLI
        run: |
          cmake -S . -B build/cli -DWEB2EXE_BUILD_CLI=ON -DWEB2EXE_BUILD_APP=OFF
          cmake --build build/cli --parallel
      - name: Utilitários de host
        run: for t in app_generator archive_builder installer_generator; do c++ -std=c++20 -O1 -Wall -Wextra src/tools/$t.cpp -o /tmp/$t; done
      - name: Smoke test
        run: |
          ./build/cli/web2exe --version
          ./build/cli/web2exe --help
          ./build/cli/web2exe --check --linux --properties-file build.prop
      - name: Regressão do exit 127 mudo (BASH inválido deve gerar mensagem)
        run: |
          out="$(BASH=/nao/existe WEB2EXE_DATA_ROOT=$PWD WEB2EXE_PROJECT_ROOT=$PWD ./build/cli/web2exe --linux --properties-file build.prop 2>&1 || true)"
          echo "$out" | grep -q "Executando:" 
