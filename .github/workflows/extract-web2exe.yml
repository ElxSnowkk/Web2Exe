name: Extrair zip

# Extrai o zip do código-fonte na raiz do repositório e faz commit dos arquivos.
# Coloque em .github/workflows/extract-zip.yml e envie o zip (ex.: Web2Exe-v1_2_0.zip) na raiz.
on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "Caminho do zip (vazio = primeiro *.zip da raiz)"
        required: false
        default: ""
  push:
    paths: ["*.zip"]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Extrair
        run: |
          zip="${{ github.event.inputs.zip_path }}"
          [ -n "$zip" ] || zip="$(ls *.zip 2>/dev/null | sort -V | tail -n1)"
          [ -f "$zip" ] || { echo "::error::zip não encontrado"; exit 1; }
          unzip -oq "$zip" -d .
          echo "Extraído: $zip"
          ls

      - name: Commit do código-fonte
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # O GITHUB_TOKEN não pode alterar .github/workflows; esses arquivos ficam de fora.
          git add -A -- . ':!*.zip' ':!.github/workflows'
          if git diff --cached --quiet; then
            echo "Nada novo para commitar."
          else
            git commit -m "Extrai código-fonte do zip"
            git push
          fi
          
